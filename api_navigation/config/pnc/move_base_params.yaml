# ============================================================
# Move Base Flex 파라미터
# ============================================================

# ===== move_base_flex 기본 설정 =====
tf_timeout: 1.5

# ===== 제어 루프 =====
controller_frequency: 5.0
controller_patience: 15.0

# ===== 진동 감지 =====
oscillation_timeout: 30.0
oscillation_distance: 2.0

# ===== Controllers 리스트 =====
controllers:
  - name: dwa_controller
    type: dwa_local_planner/DWAPlannerROS

# ===== Recovery Behaviors (비활성화) =====
recovery_behaviors: []