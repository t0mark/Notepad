# ===================================================================
# Navsat Transform Node: navsat_transform
# 역할: GPS(NavSatFix) 메시지를 Odometry 메시지로 변환
# 출력: /map_frame/gps (map 프레임)
# ===================================================================
navsat_transform:
  frequency: 30.0
  delay: 3.0
  
  # IMU와 차량 전방 방향의 차이 (라디안, 필요시 보정)
  yaw_offset: 0.0 
  
  # 자북과 진북의 차이 (한국은 거의 0)
  magnetic_declination_radians: 0.0
  
  # 고도를 0으로 설정하여 2D 평면처럼 사용
  zero_altitude: true
  
  # 첫 GPS 좌표를 map 프레임의 원점으로 사용할 때까지 기다림
  wait_for_datum: fasle
  
  # 방향(yaw) 정보를 다른 Odometry 토픽에서 가져옴 (핵심 설정)
  use_odometry_yaw: true

# ===================================================================
# Local EKF (Odom Frame): ekf_se_odom
# 역할: Faster-LIO와 IMU를 융합하여 부드럽고 연속적인 Odometry 생성
# 출력: /local/odom (odom 프레임), odom -> base_link TF
# ===================================================================
ekf_se_odom:
  frequency: 50.0
  sensor_timeout: 0.1
  two_d_mode: false

  # 프레임 설정
  map_frame: map          # 사용 안함
  odom_frame: odom        # 이 노드가 만들고 발행할 프레임
  base_link_frame: base_link # 로봇의 기준 프레임
  world_frame: odom       # odom을 기준으로 모든 것을 계산

  # 입력 1: Faster-LIO Odometry
  odom0: /faster_lio/odometry
  odom0_config:
    [false, false, false, # X, Y, Z 위치는 사용 안 함 (드리프트 때문)
     false, false, false, # Roll, Pitch, Yaw 방향도 IMU가 더 나을 수 있어 사용 안 함
     true,  true,  true,  # X, Y, Z 선속도 사용
     false, false, true,  # Roll, Pitch 각속도는 사용 안 하고, Yaw 각속도만 사용
     false, false, false]
  odom0_differential: false # LIO는 절대 위치를 주므로 false

  # 입력 2: IMU
  imu0: /ouster/imu
  imu0_config:
    [false, false, false, # X, Y, Z 위치
     true,  true,  true,  # Roll, Pitch, Yaw 방향 사용 (핵심)
     false, false, false, # X, Y, Z 선속도
     true,  true,  true,  # Roll, Pitch, Yaw 각속도 사용 (핵심)
     false, false, false]
  imu0_differential: false
  imu0_remove_gravitational_acceleration: true


# ===================================================================
# Global EKF (Map Frame): ekf_se_map
# 역할: Local EKF와 GPS를 융합하여 전역적으로 정확한 위치 추정
# 출력: /global/odom (map 프레임), map -> odom TF
# ===================================================================
ekf_se_map:
  frequency: 30.0
  sensor_timeout: 0.1
  two_d_mode: false

  # 프레임 설정
  map_frame: map          # 이 노드가 만들고 발행할 프레임
  odom_frame: odom
  base_link_frame: base_link
  world_frame: map        # map을 기준으로 모든 것을 계산

  # 입력 1: Local EKF의 출력
  odom0: /local/odom
  odom0_config:
    [true,  true,  false, # X, Y 위치 사용
     false, false, true,  # Roll, Pitch 방향은 사용 안 하고, Yaw 방향만 사용
     false, false, false, # X, Y, Z 선속도는 사용 안 함
     false, false, false, # 각속도도 사용 안 함
     false, false, false]
  odom0_differential: true   # 드리프트를 막기 위해 반드시 true

  # 입력 2: Navsat Transform의 출력 (GPS Odometry)
  odom1: /map_frame/gps
  odom1_config:
    [true,  true,  false, # X, Y 위치만 사용 (GPS의 핵심 역할)
     false, false, false, # 방향 정보는 LIO/IMU가 더 정확하므로 사용 안 함
     false, false, false,
     false, false, false,
     false, false, false]
  odom1_differential: false  # 절대 위치 정보이므로 반드시 false
